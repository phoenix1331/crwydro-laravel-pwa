services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: crwydro-app
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  queue:
    image: crwydro-app
    command: php artisan queue:work --tries=3 --sleep=1
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # The base image's check probes the web server, which this worker never runs
    healthcheck:
      disable: true

  # End-to-end tests: Playwright's image with browsers, sharing the app's network
  # so the app is on localhost (service workers need a secure origin or localhost)
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: ["e2e"]
    network_mode: "service:app"
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
    command: npx playwright test

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-crwydro}
      MYSQL_USER: ${DB_USERNAME:-crwydro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
